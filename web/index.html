<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayush Enterprises</title>
    <script>
      // The live app lives on the firebaseapp.com address: Google sign-in only works reliably on the same address
      // as its login page. Anyone who opens the web.app address is moved there (same page).
      // Safety net: if an old offline copy of the app ever answers a Firebase sign-in page, drop that copy and
      // reload so the real sign-in page comes from the server.
      if (location.pathname.indexOf('/__/') === 0 && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) })
          .then(function () { location.reload() })
      }
      if (location.hostname === 'businessautomation-2884f.web.app') {
        location.replace('https://businessautomation-2884f.firebaseapp.com' + location.pathname + location.search + location.hash)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
